name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Build production application
        run: bun run build

  parity:
    name: Route, interaction, and visual parity
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Next.js branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: next
          persist-credentials: false

      - name: Check out frozen legacy branch
        uses: actions/checkout@v6
        with:
          ref: legacy/vite
          path: legacy
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify frozen legacy baseline
        working-directory: legacy
        run: >-
          node -e "const { execFileSync } = require('node:child_process');
          const expected = 'b22f167ae5960dc2a510678524827bfb1427b7ea';
          const actual = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (actual !== expected) throw new Error('legacy/vite must resolve to ' + expected + ', got ' + actual);"

      - name: Install Next.js dependencies
        working-directory: next
        run: bun install --frozen-lockfile

      - name: Install legacy dependencies
        working-directory: legacy
        run: bun install --frozen-lockfile

      - name: Install Chromium and operating-system dependencies
        working-directory: next
        run: bunx playwright install --with-deps chromium

      - name: Run route, interaction, and visual parity
        working-directory: next
        env:
          LEGACY_DIR: ${{ github.workspace }}/legacy
        run: bun run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            next/playwright-report/
            next/test-results/
          if-no-files-found: warn
          retention-days: 14
