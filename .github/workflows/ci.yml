name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Run Vitest suite
        run: bun run test

      - name: Validate Drizzle migrations
        run: bun run db:check

      - name: Verify Drizzle schema has no diff
        run: |
          bun x drizzle-kit generate --name=ci_consistency
          git diff --exit-code -- drizzle src/db/schema.ts

      - name: Phase 6 offline release preflight
        env:
          PHASE6_REQUIRED_VARIABLES: DATABASE_URL,NEON_AUTH_COOKIE_SECRET,HERMES_KEK_V1
          PHASE6_PRESENT_VARIABLES: DATABASE_URL,NEON_AUTH_COOKIE_SECRET,HERMES_KEK_V1
          PHASE6_DATABASE_URL: postgresql://hermes_app:fixture@localhost:5432/hermespass
          PHASE6_DEPLOYMENT_BRANCH: development
          PHASE6_BASE_URL: http://localhost:3000
          PHASE6_ROUTE_CONTRACT: pass
        run: bun run release:phase6

      - name: Build production application
        run: bun run build

  postgres-integration:
    name: PostgreSQL 18 integration
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hermespass_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hermespass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run PostgreSQL 18 integration tests
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/hermespass_test
        run: bun run test:db

  parity:
    name: Route, interaction, and visual parity
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Next.js branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: next
          persist-credentials: false

      - name: Check out frozen legacy branch
        uses: actions/checkout@v6
        with:
          ref: legacy/vite
          path: legacy
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify frozen legacy baseline
        working-directory: legacy
        run: >-
          node -e "const { execFileSync } = require('node:child_process');
          const expected = 'b22f167ae5960dc2a510678524827bfb1427b7ea';
          const actual = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (actual !== expected) throw new Error('legacy/vite must resolve to ' + expected + ', got ' + actual);"

      - name: Install Next.js dependencies
        working-directory: next
        run: bun install --frozen-lockfile

      - name: Install legacy dependencies
        working-directory: legacy
        run: bun install --frozen-lockfile

      - name: Install Chromium and operating-system dependencies
        working-directory: next
        run: bunx playwright install --with-deps chromium

      - name: Run route, interaction, and visual parity
        working-directory: next
        env:
          LEGACY_DIR: ${{ github.workspace }}/legacy
        run: bun run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            next/playwright-report/
            next/test-results/
          if-no-files-found: warn
          retention-days: 14

  productization:
    name: Phase 5 productization contracts
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run productization unit contracts
        run: >-
          bun x vitest run tests/unit/productization-migration.test.ts
          tests/unit/comms.test.ts tests/unit/comms-api.test.ts
          tests/unit/n8n-workflow.test.ts tests/unit/phase5-release-gates.test.ts
          --maxWorkers=1 --fileParallelism=false

      - name: Install Chromium and operating-system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run productization browser contract
        run: bun x playwright test --config=playwright.productization.config.ts tests/e2e/productization.spec.ts
  neon-smoke:
    name: Neon Phase 5 ephemeral smoke (approval-gated)
    if: ${{ vars.HERMESPASS_NEON_SMOKE == 'true' }}
    needs: [postgres-integration, parity, productization]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Neon smoke checks
        env:
          DATABASE_URL_TEST: ${{ secrets.HERMESPASS_NEON_SMOKE_URL }}
        run: bun run test:db:smoke
